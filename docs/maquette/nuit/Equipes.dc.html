<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Équipes — nuit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161A17}
a{color:#9DBBA3}a:hover{color:#B9D1BE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #161A17; color: #ECE9E1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 48px 28px 28px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Mode.dc.html" aria-label="Retour" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #ECE9E1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: {{accent}}">Étape 2 sur 2</span>
    <span style="width: 32px"></span>
  </header>

  <div style="margin-top: 20px; display: flex; justify-content: space-between; align-items: baseline">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 36px; line-height: 1.1">Les équipes</h1>
    <span style="font-size: 13px; color: #A3ABA5">6 sur 8 gratuites</span>
  </div>

  <div role="tablist" aria-label="Format des matchs" style="margin-top: 18px; display: flex; gap: 24px; border-bottom: 1px solid #2B312D">
    <button type="button" role="tab" aria-selected="true" style="height: 44px; padding: 0; border: 0; border-bottom: 2px solid {{accent}}; margin-bottom: -1px; background: transparent; color: #ECE9E1; font: 600 14px Inter, system-ui, sans-serif">Équipe contre équipe</button>
    <button type="button" role="tab" aria-selected="false" style="height: 44px; padding: 0; border: 0; background: transparent; color: #A3ABA5; font: 500 14px Inter, system-ui, sans-serif">1 contre 1</button>
  </div>

  <label style="margin-top: 6px; min-height: 52px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #2B312D">
    <span style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; font-weight: 500">Équipes aléatoires</span>
      <span style="font-size: 12px; color: #A3ABA5">Saisis les joueurs, l'app forme les équipes</span>
    </span>
    <input type="checkbox" role="switch" aria-label="Équipes aléatoires" style="width: 22px; height: 22px; margin: 0; accent-color: {{accent}}">
  </label>

  <ul style="list-style: none; margin: 6px 0 0; padding: 0">
    <sc-for list="{{teams}}" as="t" hint-placeholder-count="6">
      <li style="min-height: 54px; display: flex; align-items: center; gap: 14px; border-bottom: 1px solid #2B312D">
        <span aria-hidden="true" style="width: 20px; font-family: Fraunces, Georgia, serif; font-size: 18px; color: {{accent}}">{{t.num}}</span>
        <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
          <span style="font-size: 15px; font-weight: 500">{{t.name}}</span>
          <span style="font-size: 12px; color: #A3ABA5">{{t.players}}</span>
        </span>
        <button type="button" aria-label="Modifier {{t.name}}" style="width: 44px; height: 44px; margin-right: -12px; border: 0; background: transparent; color: #A3ABA5; display: flex; align-items: center; justify-content: center">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        </button>
      </li>
    </sc-for>
  </ul>

  <button type="button" style="margin-top: 6px; align-self: flex-start; min-height: 44px; padding: 0; border: 0; background: transparent; color: {{accent}}; display: inline-flex; align-items: center; gap: 8px; font: 600 15px Inter, system-ui, sans-serif">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    Ajouter une équipe
  </button>

  <a href="Match.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: {{accent}}; color: #142019; font-size: 16px; font-weight: 600; text-decoration: none">Lancer le tournoi</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DBBA3","options":["#9DBBA3","#8CC2C7","#D2B48C","#B7A9DB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#9DBBA3',
      teams: [
        { num: '1', name: 'Les Chauds', players: 'Nico, Léa' },
        { num: '2', name: 'Team Pong', players: 'Max, Inès' },
        { num: '3', name: 'Les Gobelets', players: 'Tom, Sarah' },
        { num: '4', name: 'Balle Perdue', players: 'Hugo, Chloé' },
        { num: '5', name: 'Les Rebonds', players: 'Lucas, Emma' },
        { num: '6', name: 'Coup Franc', players: 'Yanis, Jade' }
      ]
    };
  }
}
</script>
</body>
</html>
