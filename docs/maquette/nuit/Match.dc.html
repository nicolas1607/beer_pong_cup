<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Match en cours — nuit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,400&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#161A17}
a{color:#9DBBA3}a:hover{color:#B9D1BE}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #161A17; color: #ECE9E1; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 48px 28px 28px; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between">
    <a href="Accueil.dc.html" aria-label="Retour à l'accueil" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; color: #ECE9E1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
    </a>
    <span style="font-size: 11px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: {{accent}}">Poule · match 4 sur 15</span>
    <a href="Classement.dc.html" aria-label="Voir le classement" style="width: 44px; height: 44px; margin-right: -12px; display: flex; align-items: center; justify-content: center; color: #ECE9E1">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="20" x2="6" y2="13"></line><line x1="12" y1="20" x2="12" y2="6"></line><line x1="18" y1="20" x2="18" y2="10"></line></svg>
    </a>
  </header>

  <section aria-label="Les Chauds" style="margin-top: 40px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1">Les Chauds</h2>
        <span style="font-size: 13px; color: #A3ABA5">Nico, Léa</span>
      </div>
      <span aria-live="polite" style="font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 84px; line-height: 0.9; color: {{accent}}; font-variant-numeric: tabular-nums">{{a}}</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div aria-hidden="true" style="display: flex; gap: 6px">
        <sc-for list="{{dotsA}}" as="d" hint-placeholder-count="6">
          <span style="width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; border: 1.4px solid {{accent}}; background: {{d.bg}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px">
        <button type="button" aria-label="Retirer un verre aux Chauds" onClick="{{decA}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413C; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" aria-label="Ajouter un verre aux Chauds" onClick="{{incA}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413C; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </section>

  <div aria-hidden="true" style="margin: 30px 0; display: flex; align-items: center; gap: 14px; color: #A3ABA5">
    <span style="flex-grow: 1; height: 1px; background: #2B312D"></span>
    <span style="font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 16px">contre</span>
    <span style="flex-grow: 1; height: 1px; background: #2B312D"></span>
  </div>

  <section aria-label="Team Pong" style="display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
        <h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.1">Team Pong</h2>
        <span style="font-size: 13px; color: #A3ABA5">Max, Inès</span>
      </div>
      <span aria-live="polite" style="font-family: Fraunces, Georgia, serif; font-weight: 300; font-size: 84px; line-height: 0.9; color: #E08E6D; font-variant-numeric: tabular-nums">{{b}}</span>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div aria-hidden="true" style="display: flex; gap: 6px">
        <sc-for list="{{dotsB}}" as="d" hint-placeholder-count="6">
          <span style="width: 12px; height: 12px; border-radius: 6px; box-sizing: border-box; border: 1.4px solid #E08E6D; background: {{d.bg}}"></span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px">
        <button type="button" aria-label="Retirer un verre à Team Pong" onClick="{{decB}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413C; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <button type="button" aria-label="Ajouter un verre à Team Pong" onClick="{{incB}}" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #3A413C; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </div>
  </section>

  <p style="margin: 40px 0 0; font-size: 13px; color: #A3ABA5">Verres touchés sur 6 · à suivre : Les Gobelets contre Coup Franc</p>

  <div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #2B312D; border-bottom: 1px solid #2B312D">
    <button type="button" style="height: 56px; border: 0; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 13px Inter, system-ui, sans-serif">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="8" y1="6" x2="20" y2="6"></line><line x1="8" y1="12" x2="20" y2="12"></line><line x1="8" y1="18" x2="20" y2="18"></line><circle cx="4" cy="6" r="0.8"></circle><circle cx="4" cy="12" r="0.8"></circle><circle cx="4" cy="18" r="0.8"></circle></svg>
      Choisir
    </button>
    <button type="button" style="height: 56px; border: 0; border-left: 1px solid #2B312D; border-right: 1px solid #2B312D; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 13px Inter, system-ui, sans-serif">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
      Au hasard
    </button>
    <button type="button" style="height: 56px; border: 0; background: transparent; color: #ECE9E1; display: flex; align-items: center; justify-content: center; gap: 6px; font: 500 13px Inter, system-ui, sans-serif">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 14 4 9 9 4"></polyline><path d="M20 20v-7a4 4 0 0 0-4-4H4"></path></svg>
      Annuler
    </button>
  </div>

  <a href="Classement.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 54px; border-radius: 999px; background: {{accent}}; color: #142019; font-size: 16px; font-weight: 600; text-decoration: none; font-variant-numeric: tabular-nums">Valider {{a}} – {{b}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9DBBA3","options":["#9DBBA3","#8CC2C7","#D2B48C","#B7A9DB"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { a: 6, b: 2 };
  }
  renderVals() {
    const max = 6;
    const accent = this.props.accent ?? '#9DBBA3';
    const clamp = (v) => Math.max(0, Math.min(max, v));
    const dots = (n, color) => Array.from({ length: max }, (_, i) => ({ bg: i < n ? color : 'transparent' }));
    return {
      accent,
      a: this.state.a,
      b: this.state.b,
      dotsA: dots(this.state.a, accent),
      dotsB: dots(this.state.b, '#E08E6D'),
      incA: () => this.setState({ a: clamp(this.state.a + 1) }),
      decA: () => this.setState({ a: clamp(this.state.a - 1) }),
      incB: () => this.setState({ b: clamp(this.state.b + 1) }),
      decB: () => this.setState({ b: clamp(this.state.b - 1) })
    };
  }
}
</script>
</body>
</html>
